# Local Postgres with pgvector, matching Neon's major version.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jobfit
      POSTGRES_PASSWORD: jobfit
      POSTGRES_DB: jobfit_local
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
